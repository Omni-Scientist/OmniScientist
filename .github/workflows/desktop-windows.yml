name: desktop-windows

# Builds OmniScientist.exe on a real Windows runner.
#
# It has to be a Windows runner, not a cross-compile: bun refuses
# --windows-hide-console, --windows-title, --windows-publisher, --windows-version
# and --windows-description unless it is compiling on Windows ("Using
# --windows-hide-console is only available when compiling on Windows"). Cross
# compiling from macOS or Linux does produce a working .exe, but it lands in the
# console subsystem, so double-clicking it pops a black console window, and it
# carries no version or publisher metadata.
#
# The artifact is ~120 MB, which is above GitHub's 100 MB per-file limit for the
# repository itself, so it ships as a release asset and never as a committed file.

on:
  push:
    tags: ["v*"]
    branches: ["main", "launch/**"]
    paths: ["desktop/**", "cli/**", ".github/workflows/desktop-windows.yml"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop-windows.yml"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the executable"
        required: false
        default: "0.0.0-dev"

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

# 建 release、往上传产物都要写权限。仓库默认给 Actions 的是只读，
# 不声明就是 403 Resource not accessible by integration。
permissions:
  contents: write

jobs:
  build:
    name: OmniScientist.exe
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        shell: pwsh
        run: |
          irm bun.sh/install.ps1 | iex
          "$env:USERPROFILE\.bun\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: The four implementations must stay in step
        shell: pwsh
        run: python scripts/check_parity.py

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") { $version = $env:GITHUB_REF_NAME -replace '^v', '' }
          else { $version = "${{ inputs.version }}"; if (-not $version) { $version = "0.0.0-dev" } }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "building $version"

      - name: Build the package
        shell: pwsh
        run: |
          cd desktop\packaging\windows
          .\build-windows.ps1 -Version "${{ steps.version.outputs.value }}" -Target bun-windows-x64

      - name: Verify what we are about to ship
        shell: pwsh
        run: |
          $zip = Get-ChildItem desktop\packaging\windows\dist\*.zip | Select-Object -First 1
          if (-not $zip) { throw "no package was produced" }
          $work = Join-Path $env:RUNNER_TEMP "verify"
          Expand-Archive -Path $zip.FullName -DestinationPath $work -Force
          $exe = Get-ChildItem -Recurse -Filter OmniScientist.exe $work | Select-Object -First 1
          if (-not $exe) { throw "the package has no OmniScientist.exe" }

          # Do NOT assert the GUI subsystem here. --windows-hide-console hides the
          # console at RUNTIME; bun 1.3.x still emits a console-subsystem (3) PE.
          # Verified on Windows 2026-08-16: launched from the Start Menu shortcut the
          # process has MainWindowHandle 0 and no console window appears. Asserting
          # subsystem == 2 rejects a perfectly good build.
          $bytes = [IO.File]::ReadAllBytes($exe.FullName)
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          Write-Host ("PE subsystem = " + [BitConverter]::ToUInt16($bytes, $pe + 0x5c) + " (informational)")

          # The metadata flags are the part worth asserting: they only work when the
          # build really ran on Windows, which is why this job exists.
          $meta = (Get-Item $exe.FullName).VersionInfo
          if ($meta.ProductName -ne "OmniScientist") { throw "missing product metadata: $($meta.ProductName)" }
          if ($meta.CompanyName -ne "Omni-Scientist") { throw "missing publisher metadata: $($meta.CompanyName)" }

          $info = (Get-Item $exe.FullName).VersionInfo
          Write-Host "product   = $($info.ProductName)"
          Write-Host "publisher = $($info.CompanyName)"
          Write-Host "version   = $($info.FileVersion)"

          # It must at least start, publish a session and answer /api/health.
          $home_ = Join-Path $env:RUNNER_TEMP "home"
          New-Item -ItemType Directory -Force $home_ | Out-Null
          # 子进程继承当前进程的环境；-Environment 参数要 PowerShell 7.4+，不赌 runner 版本。
          $env:USERPROFILE = $home_
          $proc = Start-Process -FilePath $exe.FullName -ArgumentList "--no-open","--verbose" -PassThru
          try {
            $lock = Join-Path $home_ ".omnisci\desktop.lock"
            for ($i = 0; $i -lt 60 -and -not (Test-Path $lock); $i++) { Start-Sleep -Milliseconds 500 }
            if (-not (Test-Path $lock)) { throw "the service never wrote a lock file" }
            $port = (Get-Content $lock | ConvertFrom-Json).port
            $health = Invoke-RestMethod "http://127.0.0.1:$port/api/health"
            if (-not $health.ok) { throw "health check failed" }
            Write-Host "health ok on port $port, workspace $($health.workspace)"

            # /api/health 过了不代表界面能看：静态资源少嵌一半时它照样 ok，
            # 而用户看到的是没有 logo、图片全裂。所以真去取一次首屏要用的东西。
            $token = (Get-Content $lock | ConvertFrom-Json).token
            $session = New-Object Microsoft.PowerShell.Commands.WebRequestSession
            Invoke-WebRequest -Uri "http://127.0.0.1:$port/?t=$token" -WebSession $session -UseBasicParsing | Out-Null
            foreach ($asset in @("/", "/assets/omni-logo.svg")) {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:$port$asset" -WebSession $session -UseBasicParsing
              if ($r.StatusCode -ne 200) { throw "$asset returned $($r.StatusCode)" }
              if ($r.RawContentLength -lt 512) { throw "$asset came back suspiciously small ($($r.RawContentLength) bytes)" }
              Write-Host "asset ok $asset -> $($r.RawContentLength) bytes"
            }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: OmniScientist-windows
          path: |
            desktop/packaging/windows/dist/*.zip
            desktop/packaging/windows/dist/*.sha256
          if-no-files-found: error

      # release.yml 也被同一个 tag 触发，但它要等所有矩阵 job（含排队很久的 Intel mac）
      # 跑完才建 release。Windows 这边一分钟就编完，先到一步就撞上 "release not found"。
      # 所以这里自己兜底：没有就先建一个草稿，谁先到谁建，另一边用 --clobber 覆盖同名资产。
      - name: Attach to the release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "release $tag 还不存在，先建一个草稿"
            gh release create $tag --draft --title "OmniScientist $($tag -replace '^v', '')" --notes ""
            if ($LASTEXITCODE -ne 0) { throw "建 release $tag 失败" }
          }
          $files = Get-ChildItem desktop\packaging\windows\dist\*.zip, desktop\packaging\windows\dist\*.sha256 |
                   ForEach-Object { $_.FullName }
          if (-not $files) { throw "没有可上传的产物" }
          gh release upload $tag $files --clobber
          if ($LASTEXITCODE -ne 0) { throw "上传到 release $tag 失败" }
