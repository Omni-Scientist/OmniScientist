name: desktop-windows

# Builds the Tauri desktop app for Windows: OmniScientist_<version>_x64-setup.exe.
#
# It has to be a Windows runner: the NSIS installer and the WebView2 loader only
# assemble there, and the sidecar service binary gets its version/publisher
# metadata only when bun compiles on Windows.
#
# The installer is ~36 MB and ships as a workflow artifact (and as a release
# asset on tags), never as a committed file.
#
# NOTE(v0.2.0 transition): release.yml still expects the old browser-mode
# OmniSci-Desktop-Windows-x64.zip on tags. Do not cut a tag until release.yml,
# assetPatternFor() and the website download links have been moved to the
# installer asset set.

on:
  push:
    tags: ["v*"]
    branches: ["main", "launch/**"]
    paths: ["desktop/**", "cli/**", ".github/workflows/desktop-windows.yml"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop-windows.yml"]
  workflow_dispatch:

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

# 建 release、往上传产物都要写权限。仓库默认给 Actions 的是只读，
# 不声明就是 403 Resource not accessible by integration。
permissions:
  contents: write

jobs:
  build:
    name: OmniScientist setup.exe
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        shell: pwsh
        run: |
          irm bun.sh/install.ps1 | iex
          "$env:USERPROFILE\.bun\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: The five implementations must stay in step
        shell: pwsh
        run: python scripts/check_parity.py

      # 版本号的唯一来源是 tauri.conf.json（parity 保证它跟其余四处一致）。
      # 打了 tag 时断言 tag 就是它，别让发行版和程序自报的版本各说各话。
      - name: The tag must match the configured version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $conf = (Get-Content desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $tag = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($tag -ne $conf) { throw "tag $tag != tauri.conf.json $conf" }

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: cargo-windows-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}

      - name: Build the sidecar service binary
        shell: pwsh
        run: |
          cd cli; bun install --frozen-lockfile; cd ..
          cd desktop
          bun install --frozen-lockfile
          bun run build:desktop
          New-Item -ItemType Directory -Force src-tauri\binaries | Out-Null
          Copy-Item dist-desktop\omnisci-desktop.exe src-tauri\binaries\omnisci-desktop-x86_64-pc-windows-msvc.exe

      - name: Build the installer
        shell: pwsh
        working-directory: desktop
        run: bun x tauri build --bundles nsis

      - name: Verify what we are about to ship
        shell: pwsh
        run: |
          $setup = Get-ChildItem desktop\src-tauri\target\release\bundle\nsis\*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "no installer was produced" }
          Write-Host ("installer = " + $setup.Name + " " + [math]::Round($setup.Length / 1MB, 1) + " MB")

          # The shell must carry product metadata; that is half the point of a
          # native app over a bare service binary.
          $shell_ = "desktop\src-tauri\target\release\OmniScientist.exe"
          $meta = (Get-Item $shell_).VersionInfo
          if ($meta.ProductName -ne "OmniScientist") { throw "missing product metadata: $($meta.ProductName)" }
          Write-Host "product = $($meta.ProductName), version = $($meta.FileVersion)"

          # The sidecar must start, publish a session and answer /api/health,
          # and actually serve the interface assets it claims to embed.
          $exe = "desktop\src-tauri\binaries\omnisci-desktop-x86_64-pc-windows-msvc.exe"
          $home_ = Join-Path $env:RUNNER_TEMP "home"
          New-Item -ItemType Directory -Force $home_ | Out-Null
          $env:USERPROFILE = $home_
          $proc = Start-Process -FilePath $exe -ArgumentList "--no-open","--verbose" -PassThru
          try {
            $lock = Join-Path $home_ ".omnisci\desktop.lock"
            for ($i = 0; $i -lt 60 -and -not (Test-Path $lock); $i++) { Start-Sleep -Milliseconds 500 }
            if (-not (Test-Path $lock)) { throw "the service never wrote a lock file" }
            $port = (Get-Content $lock | ConvertFrom-Json).port
            $health = Invoke-RestMethod "http://127.0.0.1:$port/api/health"
            if (-not $health.ok) { throw "health check failed" }
            Write-Host "health ok on port $port"

            $token = (Get-Content $lock | ConvertFrom-Json).token
            $session = New-Object Microsoft.PowerShell.Commands.WebRequestSession
            Invoke-WebRequest -Uri "http://127.0.0.1:$port/?t=$token" -WebSession $session -UseBasicParsing | Out-Null
            foreach ($asset in @("/", "/assets/omni-logo.svg", "/splash.html")) {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:$port$asset" -WebSession $session -UseBasicParsing
              if ($r.StatusCode -ne 200) { throw "$asset returned $($r.StatusCode)" }
              if ($r.RawContentLength -lt 512) { throw "$asset came back suspiciously small ($($r.RawContentLength) bytes)" }
              Write-Host "asset ok $asset -> $($r.RawContentLength) bytes"
            }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

          # The installer itself must install: silent mode, then the shell, the
          # sidecar and the uninstaller must all land.
          Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait
          $installed = Join-Path $env:LOCALAPPDATA "OmniScientist"
          foreach ($file in @("OmniScientist.exe", "omnisci-desktop.exe", "uninstall.exe")) {
            if (-not (Test-Path (Join-Path $installed $file))) { throw "silent install missing $file" }
          }
          Write-Host "silent install ok -> $installed"

      - uses: actions/upload-artifact@v4
        with:
          name: OmniScientist-windows-setup
          path: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      # release.yml 也被同一个 tag 触发；这里先到就先建草稿，晚到就 --clobber 覆盖。
      - name: Attach to the release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "release $tag 还不存在，先建一个草稿"
            gh release create $tag --draft --generate-notes --title "OmniScientist $($tag -replace '^v', '')"
            if ($LASTEXITCODE -ne 0) { throw "建 release $tag 失败" }
          }
          $files = Get-ChildItem desktop\src-tauri\target\release\bundle\nsis\*-setup.exe |
                   ForEach-Object { $_.FullName }
          if (-not $files) { throw "没有可上传的产物" }
          gh release upload $tag $files --clobber
          if ($LASTEXITCODE -ne 0) { throw "上传到 release $tag 失败" }
