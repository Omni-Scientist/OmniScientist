name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，比如 0.1.0（不带 v）"
        required: true

permissions:
  contents: write

env:
  BUN_VERSION: "1.3.14"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.pick.outputs.value }}
    steps:
      - id: pick
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

  # 产物名里不带版本号，这样 releases/latest/download/<name> 是一条永远有效的
  # 链接，install.sh 和文档都不用跟着每次发版改。
  #
  # 一律用原生 runner 编。CLI 依赖 @resvg/resvg-js 这个原生模块，交叉编译能编出
  # 文件，但塞进去的 .node 是宿主架构的，而它是懒加载的：只有渲染公式那一刻才炸。
  cli:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel Mac 不发（决定于 2026-08-18）。install.sh 在 Intel Mac 上仍会去下
          # omnisci-darwin-x86_64 并拿到 404，这是明知的取舍，不是漏了。
          - { runner: ubuntu-latest,    asset: omnisci-linux-x86_64 }
          - { runner: ubuntu-24.04-arm, asset: omnisci-linux-arm64 }
          - { runner: macos-latest,     asset: omnisci-darwin-arm64 }
          - { runner: windows-latest,   asset: omnisci-windows-x86_64.exe }
    runs-on: ${{ matrix.runner }}
    # ARM Linux runner 在私有仓库上不免费，缺了不该拖垮整个发布
    continue-on-error: ${{ matrix.runner == 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "${{ env.BUN_VERSION }}" }
      - working-directory: cli
        run: bun install --frozen-lockfile

      # skill 嵌进二进制，发行版因此是单个文件：没有要解压的包，也没有必须保持
      # 完整的目录结构。生成物是提交过的，这里顺带确认它没漂。
      - name: 确认内嵌清单没漂
        shell: bash
        working-directory: cli
        run: |
          bun run tools/gen-skill-assets.ts
          git diff --exit-code src/skill-assets.generated.ts

      - name: 编译
        shell: bash
        working-directory: cli
        run: |
          bun build --compile --minify --define 'process.env.DEV="false"' \
            src/cli.tsx --outfile "dist/${{ matrix.asset }}"

      # Apple Silicon 上内核拒绝执行没签名的可执行文件。ad-hoc 签名免费、与
      # Gatekeeper 无关（curl 下载的文件不带隔离属性，根本不会被问）。
      - name: ad-hoc 签名
        if: runner.os == 'macOS'
        working-directory: cli
        run: codesign --force --sign - "dist/${{ matrix.asset }}"

      - name: 自检：旁边什么都没有也要能跑
        if: runner.os != 'Windows'
        shell: bash
        working-directory: cli
        run: |
          tmp=$(mktemp -d); cp "dist/${{ matrix.asset }}" "$tmp/omnisci"
          ( cd "$tmp" && HOME="$tmp/home" ./omnisci --help | head -1 )

      - name: 校验和
        shell: bash
        working-directory: cli/dist
        run: |
          if command -v sha256sum >/dev/null; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            cli/dist/${{ matrix.asset }}
            cli/dist/${{ matrix.asset }}.sha256

  desktop:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    os: linux,  arch: x86_64 }
          - { runner: ubuntu-24.04-arm, os: linux,  arch: arm64 }
          - { runner: macos-latest,     os: macos,  arch: arm64 }
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.runner == 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "${{ env.BUN_VERSION }}" }
      - working-directory: cli
        run: bun install --frozen-lockfile      # gateway 从 cli/src 取代码
      - working-directory: desktop
        run: bun install --frozen-lockfile
      - working-directory: desktop
        run: bun run build:assets
      - working-directory: desktop
        run: bun build --compile --minify launcher/main.ts --outfile dist-desktop/omnisci-desktop

      - name: 打 Linux 安装包
        if: matrix.os == 'linux'
        working-directory: desktop
        run: |
          ./packaging/linux/build-linux.sh --binary dist-desktop/omnisci-desktop \
            --version "${{ needs.version.outputs.value }}" --arch "${{ matrix.arch }}" --out staging
          mkdir -p artifacts
          mv staging/*.tar.gz "artifacts/OmniScientist-linux-${{ matrix.arch }}.tar.gz"
          ( cd artifacts && sha256sum "OmniScientist-linux-${{ matrix.arch }}.tar.gz" \
              > "OmniScientist-linux-${{ matrix.arch }}.tar.gz.sha256" )

      # .app 外壳、菜单栏宿主、ad-hoc 签名和 tar 往返校验都在 build-app.sh 里，
      # 那套在真机 macOS 15.7.7 / M3 上验收过。
      - name: 打 macOS 应用
        if: matrix.os == 'macos'
        working-directory: desktop
        run: |
          ./packaging/macos/build-app.sh --binary dist-desktop/omnisci-desktop \
            --version "${{ needs.version.outputs.value }}" --out staging
          mkdir -p artifacts
          mv staging/*.tar.gz "artifacts/OmniScientist-macos-${{ matrix.arch }}.tar.gz"
          ( cd artifacts && shasum -a 256 "OmniScientist-macos-${{ matrix.arch }}.tar.gz" \
              > "OmniScientist-macos-${{ matrix.arch }}.tar.gz.sha256" )

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: desktop/artifacts/*

  skill:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          python3 -m pip install --quiet numpy pandas matplotlib
          python3 skill/build.py --zip artifacts
      - run: cd artifacts && sha256sum omnisci-skill.zip > omnisci-skill.zip.sha256
      - uses: actions/upload-artifact@v4
        with: { name: skill, path: artifacts/* }

  publish:
    # 以前这里是 `if: always() && needs.version.result == 'success'`：cli / desktop /
    # skill 任何一个挂掉，publish 照样跑，把"当时凑得齐的那些"当正式版发出去
    # （draft: false）。少了哪个平台没人拦，用户下载到 404 才知道。
    #
    # 现在按 needs 的默认语义：全都成功才发。Linux ARM 那一格自己带
    # continue-on-error，它挂了不算 job 失败，所以"ARM 可缺席"这条原意还在。
    needs: [version, cli, desktop, skill]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: staging }
      - name: 汇总并列出实际拿到的产物
        run: |
          # 校验和只发 SHA256SUMS 一个文件。以前每个产物旁边还挂一份同名 .sha256，
          # release 页上 10 个包变成 20 项，一半是噪音。所以 .sha256 压根不进 release/，
          # 只把内容合进 SHA256SUMS。
          #
          # sed 抹掉 Windows runner 写出来的 * 前缀（sha256sum 的二进制模式），让整份文件
          # 一个格式：sha256sum -c 两种都认，但 install.sh / install.ps1 是按文件名找行的。
          mkdir -p release
          find staging -type f ! -name '*.sha256' -exec cp {} release/ \;
          find staging -type f -name '*.sha256' -exec cat {} + \
            | sed 's/ \*/  /' | sort -k2 > release/SHA256SUMS
          echo "### 本次实际产出" >> "$GITHUB_STEP_SUMMARY"
          ls -lh release | tee -a "$GITHUB_STEP_SUMMARY"

      # "job 成功了"不等于"产物真的在这儿"。安装脚本和自动更新是照着固定名字去取的，
      # 少一个就是线上 404，而这种 404 只有那个平台的用户会遇到，我们自己看不见。
      # 所以按名单点一遍，缺了就别发。
      #
      # 名单跟 install.sh / install.ps1 / assetPatternFor() 是同一套名字，
      # check_parity.py 会盯着它们别漂。
      - name: 点名单：必须有的产物一个都不能少
        run: |
          missing=0
          for asset in \
            omnisci-linux-x86_64 \
            omnisci-darwin-arm64 \
            omnisci-windows-x86_64.exe \
            omnisci-skill.zip \
            OmniScientist-linux-x86_64.tar.gz \
            OmniScientist-macos-arm64.tar.gz
          do
            if [ -f "release/$asset" ]; then
              echo "  有 $asset"
            else
              echo "::error::缺少必须的产物 $asset"
              missing=1
            fi
          done
          # Linux ARM 允许缺席（runner 在私有仓库上不免费），缺了只提醒不拦。
          for asset in omnisci-linux-arm64 OmniScientist-linux-arm64.tar.gz; do
            [ -f "release/$asset" ] || echo "::warning::$asset 这次没出来（Linux ARM 允许缺席）"
          done
          exit $missing

      # Windows 桌面包是 desktop-windows.yml 单独挂上去的，这个 job 的 staging 里没有它，
      # 所以它的校验和进不了上面那份 SHA256SUMS。那条工作流一分钟就编完，跑到这一步通常
      # 已经挂好了。
      #
      # 以前没赶上就只提醒、照发。现在不行了：桌面版的"下载新版本"按钮会核对
      # SHA256SUMS，表里没有这一行就直接拒绝下载（这是设计，不校验的包不给用户），
      # 于是这一行缺席等于所有 Windows 用户的更新按钮当场失效。打了 tag 的正式发布
      # 要等它，等不到就让这一步失败，别发一个更新按钮是坏的版本出去。
      - name: 把 Windows 桌面包的校验和并进来
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.version.outputs.value) }}"
          for attempt in $(seq 1 20); do
            if gh release download "$tag" --pattern 'OmniScientist-*-windows-x64.zip' --dir win 2>/dev/null; then
              ( cd win && sha256sum -- *.zip >> ../release/SHA256SUMS )
              sort -k2 -o release/SHA256SUMS release/SHA256SUMS
              rm -rf win
              echo "Windows 包的校验和已并入 SHA256SUMS"
              exit 0
            fi
            echo "Windows 桌面包还没挂上来，第 $attempt 次等待"
            sleep 30
          done
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "::error::等了 10 分钟 Windows 桌面包还没挂上来。发出去的话 Windows 用户的更新按钮会因为校验和缺失而失效。"
            exit 1
          fi
          echo "::warning::Windows 桌面包还没挂上来，SHA256SUMS 里不含它（非 tag 构建，不拦）"

      # desktop-windows.yml 一分钟就编完，它发现 release 不存在会先建一个草稿占位，
      # 正文是 --generate-notes 出的那一行 changelog。而这个 action 对**已存在**的
      # release 不会用 body 去盖掉已有正文，于是占位那行就成了最终正文，发布页上
      # 除了一行 changelog 什么都没有。v0.1.3 就是这么空的，当场手工补的。
      #
      # 所以正文不再指望这个 action：它只管传产物，正文由下面那步用 gh CLI 强制写。
      # body_path 仍然给着，是为了 release 由这边首创（不经过占位）时也对。
      - uses: softprops/action-gh-release@v2
        with:
          append_body: false
          name: OmniScientist ${{ needs.version.outputs.value }}
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.version.outputs.value) }}
          draft: false
          generate_release_notes: true
          files: release/*
          body_path: .github/release-notes.md

      # 兜底。幂等：正文已经就位就不动，只有占位那种情况才补，并把自动生成的
      # changelog 那行留在末尾。最坏结果是没补上，不会把已有正文弄坏。
      - name: Make sure the release page is not blank
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          current="$(gh release view "$tag" --json body --jq .body)"
          if printf '%s' "$current" | grep -q '^## Install'; then
            echo "正文已就位，不动它"
            exit 0
          fi
          echo "正文只有 changelog 或是空的，补上说明"
          cp .github/release-notes.md notes.md
          changelog="$(printf '%s' "$current" | grep -E '^\*\*Full Changelog\*\*' || true)"
          if [ -n "$changelog" ]; then
            printf '\n%s\n' "$changelog" >> notes.md
          fi
          gh release edit "$tag" --notes-file notes.md
          echo "发布页正文已写入"