<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>OmniScientist</title>
<style>
  /* 壳的开屏页。窗口一出现就显示它，本机服务就绪后原窗口跳转到真界面。
     没有它的话，用户会盯着白屏等服务启动，观感像卡死。 */
  :root { color-scheme: light dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #fafbfc; color: #1f2328;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #16181a; color: #e7e9ea; }
  }
  .wrap { text-align: center; }
  .name { font-size: 20px; font-weight: 600; letter-spacing: 0.2px; }
  .hint { margin-top: 10px; font-size: 12px; opacity: 0.55; }
  .bar {
    width: 128px; height: 2px; margin: 18px auto 0; border-radius: 2px;
    background: rgba(127, 127, 127, 0.25); overflow: hidden; position: relative;
  }
  .bar::after {
    content: ""; position: absolute; top: 0; left: -40%; width: 40%; height: 100%;
    border-radius: 2px; background: currentColor; opacity: 0.7;
    animation: slide 1.1s ease-in-out infinite;
  }
  @keyframes slide { to { left: 100%; } }
  .late { display: none; }
  .late.show { display: block; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="name">OmniScientist</div>
    <div class="bar" aria-hidden="true"></div>
    <p class="hint">正在启动本地服务…</p>
    <p class="hint late" id="late">启动比平时慢，如长时间停在这里，请关闭窗口重开</p>
  </div>
  <script>
    setTimeout(function () { document.getElementById("late").classList.add("show"); }, 25000);
  </script>
</body>
</html>
